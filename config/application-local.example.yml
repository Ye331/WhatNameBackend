# 新版请优先使用 application-coursework.example.yml。
# 由 scripts/dev.ps1 setup 生成 application-coursework.yml，保留旧配置和旧数据库。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3308/unified_permission_coursework?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Taipei&forceConnectionTimeZoneToSession=true
    username: iam_dev
    password: "__MYSQL_APP_PASSWORD__"
iam:
  security:
    local-keys: true
    jwt-issuer: coursework-iam
    jwt-audience: coursework-apps
    jwt-key-id: local-dev
    data-signing:
      local-auto-generate: true
  integration:
    hr-key: ${IAM_HR_SERVICE_KEY:__HR_KEY__}
    oa-key: ${IAM_OA_SERVICE_KEY:__OA_KEY__}
    apps:
      OA:
        key: ${IAM_OA_APP_KEY:__OA_APP_KEY__}
      HR:
        key: ${IAM_HR_APP_KEY:__HR_APP_KEY__}
