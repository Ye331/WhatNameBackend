      operationId: OA01
      summary: 执行 OA 已批准角色授权或回收
      description: '由可信 OA 服务已获准的角色、对象和操作范围决定执行资格，不重新检查原申请人的当前管理任命。OA 身份不能代表超级用户。撤销时指定要回收的审批授权依据，不误删其他来源；同一审批单和目标角色的有效
        OA 授权来源须防重复登记，不仅检查 eventId。

        补充：REVOKE 事件须包含需撤销的 grantSourceId 或已批准审批单 approvalId，必须能唯一定位 OA 授权依据；原申请人标识如提供仅作审计，不作执行期授权判断。

        可信状态：可能扩大或缩减权限，同事务保存事实、签名和审计。

        协议按API规范2.4节执行；真实部署地址由配置确定。

