components:
  securitySchemes:
    UserBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ServiceSignature:
      type: apiKey
      in: header
      name: X-Request-Signature
      description: HTTPS + Ed25519请求签名。必需clientId、keyId、Unix秒时间戳、nonce和Base64签名；规范化消息见API规范2.4；MySQL唯一nonce防重放。服务绑定应用与执行范围。
  schemas:
    ApiError:
      type: object
      required:
      - success
      - code
      - message
      - requestId
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
      additionalProperties: false
    ApiEnvelope:
      type: object
      required:
      - success
      - code
      - requestId
      properties:
        success:
          type: boolean
        code:
          type: string
        requestId:
          type: string
        data:
          type: object
          additionalProperties: true
      description: 通用成功响应外层包装；各操作会定义 data 字段的具体结构。
