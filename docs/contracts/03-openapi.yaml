                    - grantSourceId
                  - required:
                    - originalApprovalId
              - properties:
                  operation:
                    type: string
                    enum:
                    - REVOKE
                oneOf:
                - required:
                  - grantSourceId
                - required:
                  - originalApprovalId
            example:
              sourceSystem: OA
              eventId: OA-001
              approvalId: APPR-001
              approvalStatus: APPROVED
              operation: GRANT
              targetUserId: '101'
              roleId: '5'
              approvedAt: '2026-10-12T10:00:00+08:00'
