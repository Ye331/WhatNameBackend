                originalApprovalId:
                  type: string
                  description: REVOKE时选填，原授权审批单；与grantSourceId二选一
              additionalProperties: false
              required:
              - sourceSystem
              - eventId
              - approvalId
              - approvalStatus
              - operation
              - targetUserId
              - roleId
              - approvedAt
              oneOf:
              - properties:
                  operation:
