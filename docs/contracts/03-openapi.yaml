        description: 服务请求签名必需头，规则见API规范2.4
      - name: X-Request-Timestamp
        in: header
        required: true
        schema:
          type: string
        description: 服务请求签名必需头，规则见API规范2.4
      - name: X-Request-Nonce
        in: header
        required: true
        schema:
          type: string
        description: 服务请求签名必需头，规则见API规范2.4
      - name: X-Key-Id
        in: header
        required: true
        schema:
          type: string
        description: 服务签名公钥标识
      responses:
        '200':
          description: 鉴权服务成功产生决策；只有 data.allowed=true 才能执行受保护API
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  code:
                    type: string
                  requestId:
                    type: string
                  data:
                    type: object
                    properties:
                      allowed:
                        type: boolean
                      reasonCode:
                        type: string
                      decisionId:
                        type: string
                      permissionVersion:
                        type: string
                        description: 本次规范化事实证据SHA-256摘要，不是缓存发布版本
                    additionalProperties: false
                    required:
                    - allowed
                    - reasonCode
                    - decisionId
                    - permissionVersion
                additionalProperties: false
                required:
                - success
                - code
                - requestId
                - data
              examples:
                allow:
                  summary: 允许
                  value:
                    success: true
                    code: OK
                    requestId: req-demo
                    data:
                      allowed: true
                      reasonCode: ALLOW
                      decisionId: AUTH-001
                      permissionVersion: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                deny:
                  summary: 拒绝（HTTP200也不得放行）
                  value:
                    success: true
                    code: OK
                    requestId: req-demo
                    data:
                      allowed: false
                      reasonCode: NO_EFFECTIVE_MENU_PERMISSION
                      decisionId: AUTH-002
                      permissionVersion: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        '400':
          description: 参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 身份或令牌无效
