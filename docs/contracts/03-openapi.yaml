      operationId: AU03
      summary: 业务服务端实时 API 鉴权
      description: 可信业务服务+用户JWT；在本次新的数据库一致事务中检查账号、会话sv/jti、部门祖先、角色来源、菜单/API及签名。同步提交审计后返回决策；仅allowed=true放行。无Redis、缓存发布版本或栅栏。permissionVersion是本次事实证据摘要。真实管理入口仍需M5对象范围检查。
