          description: 操作已完成或查询成功；鉴权接口还须检查 data.allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  code:
                    type: string
                  requestId:
                    type: string
                  data:
                    type: object
                    properties:
                      eventId:
                        type: string
                      processingStatus:
                        type: string
                      grantSourceId:
                        type: string
                      idempotentReplay:
                        type: boolean
                    additionalProperties: false
                    required:
                    - eventId
                    - processingStatus
                    - grantSourceId
                    - idempotentReplay
                additionalProperties: false
                required:
                - success
