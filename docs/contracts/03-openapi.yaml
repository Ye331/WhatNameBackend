              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 必要可信权限状态、签名、审计或外部服务不可用；安全拒绝。事务失败不报告成功；响应丢失按原事件ID或任务键查询已提交结果。PENDING_RECOVERY仅用于外部事件受控恢复，不表示缓存发布。
          content:
            application/json:
