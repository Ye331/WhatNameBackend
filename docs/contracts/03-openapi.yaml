          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 必要可信权限状态、签名、审计或外部服务不可用；安全拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
