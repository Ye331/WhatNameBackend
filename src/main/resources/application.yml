server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: iam-backend
  config:
    import: optional:file:./config/application-local.yml
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:unified_permission}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Taipei&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:iam_dev}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 0
      connection-timeout: 3000
      initialization-fail-timeout: -1
      transaction-isolation: TRANSACTION_REPEATABLE_READ
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Taipei
    serialization:
      write-dates-as-timestamps: false

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.whatname.iam.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    local-cache-scope: STATEMENT

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  pattern:
    level: '%5p [requestId=%X{requestId:-}]'
