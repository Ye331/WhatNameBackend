server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: iam-backend
  config:
    import: optional:file:./config/application-coursework.yml
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:unified_permission_coursework}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Taipei&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:iam_dev}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 0
      connection-timeout: 3000
      initialization-fail-timeout: -1
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot.allow_jdbc_metadata_access: false
        cache.use_second_level_cache: false
        cache.use_query_cache: false
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Taipei
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

iam:
  security:
    local-keys: true
    data-signing:
      local-auto-generate: true
  integration:
    hr-key: ${IAM_HR_SERVICE_KEY:}
    oa-key: ${IAM_OA_SERVICE_KEY:}
    apps:
      OA:
        key: ${IAM_OA_APP_KEY:}
      HR:
        key: ${IAM_HR_APP_KEY:}

logging:
  level:
    # Driver errors may contain identity values; the application logs only error categories.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
  pattern:
    level: '%5p [requestId=%X{requestId:-}]'
